spring:
  application:
    name: vibelex
  datasource:
    url: jdbc:mysql://localhost:3306/vibelex_db
    username: root
    password: wjn2021$
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
vibelex:
  actors: editor01,reviewer01,admin01,system
  default-actor: system
  data-directory: data
  crawling:
    enabled: true
    worker:
      fixed-delay-millis: 3000
      lease-seconds: 120
      actor-id: system
    popcidian:
      enabled: true
      base-url: https://www.popcidian.com
      sitemap-url: https://www.popcidian.com/sitemap.xml
      sync-cron: "0 30 3 * * *"
      request-timeout-seconds: 30
      maximum-attempts: 3
      maximum-discovered-items: 5000
      user-agent: VibeLexCrawler/3.0
  import:
    max-file-bytes: 52428800
  llm:
    scenarios:
      variant-generation:
        # 仅控制候选词条批准时的自动生成；页面中的手动生成功能始终可用。
        enabled: false
        base-url: https://ark.cn-beijing.volces.com/api/v3
        api-key: fe4f4cd4-39f2-4908-ab5f-d5220159242b
        model: doubao-seed-2-0-lite-260428
        prompt: classpath:prompts/variant-generation.md
        temperature: 0.2
        web-search-max-keyword: 2
        request-timeout-seconds: 90
  recognition:
    v2:
      enabled: true
      semantic-recall-enabled: true
      min-confidence: 0.6
      max-results: 20
      sentence-max-characters: 480
      fallback-to-v1-on-search-failure: true
      fallback-to-v1-on-embedding-failure: true
      elasticsearch:
        enabled: true
        uris: ${VIBELEX_ES_URIS:http://10.145.12.11:9200/}
        index-name: vibelex_sense_v2
        index-alias: vibelex_sense_current
        connect-timeout-millis: 1000
        request-timeout-millis: 3000
        lexical-top-k: 20
        semantic-top-k: 20
        minimum-semantic-score: 0.65
      embedding:
        enabled: true
        endpoint: https://xmedia-t.api.leiniao.com/edu-embedding/embedding/get_vector
        model-name: bge-large-zh
        vector-dimension: 1024
        similarity: cosine
        connect-timeout-millis: 3000
        request-timeout-millis: 30000
      index-worker:
        fixed-delay-millis: 5000
