spring:
  application:
    name: vibelex
  task:
    scheduling:
      pool:
        size: ${VIBELEX_SCHEDULING_POOL_SIZE:5}
      thread-name-prefix: vibelex-scheduler-
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
vibelex:
  actors: editor01,reviewer01,admin01,system
  default-actor: system
  data-directory: data
  crawling:
    enabled: true
    worker:
      fixed-delay-millis: 500
      lease-seconds: ${VIBELEX_CRAWLING_WORKER_LEASE_SECONDS:240}
      actor-id: system
    popcidian:
      enabled: true
      scheduled-enabled: false
      base-url: https://www.popcidian.com
      sitemap-url: https://www.popcidian.com/sitemap.xml
      sync-cron: "0 30 3 * * *"
      request-timeout-seconds: 30
      maximum-attempts: 3
      maximum-discovered-items: 5000
      user-agent: VibeLexCrawler/3.0
    regengbaike:
      enabled: true
      scheduled-enabled: false
      base-url: https://regengbaike.com
      sitemap-url: https://regengbaike.com/addons/cms/sitemap/archives/sitemap.xml
      sync-cron: "0 0 4 * * *"
      request-timeout-seconds: 30
      maximum-attempts: 3
      maximum-discovered-items: 5000
      user-agent: VibeLexCrawler/3.1
  import:
    max-file-bytes: 52428800
    worker:
      fixed-delay-millis: 500
      lease-seconds: ${VIBELEX_IMPORT_WORKER_LEASE_SECONDS:240}
      maximum-attempts: 3
      actor-id: system
  llm:
    providers:
      ark-search:
        protocol: responses
        base-url: ${VIBELEX_SEARCH_LLM_BASE_URL}
        api-key: ${VIBELEX_SEARCH_LLM_API_KEY}
        model: ${VIBELEX_SEARCH_LLM_MODEL}
        request-timeout-seconds: ${VIBELEX_SEARCH_LLM_REQUEST_TIMEOUT_SECONDS:180}
      general-openai:
        protocol: chat-completions
        base-url: ${VIBELEX_GENERAL_LLM_BASE_URL}
        api-key: ${VIBELEX_GENERAL_LLM_API_KEY}
        model: ${VIBELEX_GENERAL_LLM_MODEL}
        request-timeout-seconds: ${VIBELEX_GENERAL_LLM_REQUEST_TIMEOUT_SECONDS:90}
    scenarios:
      variant-generation:
        # 仅控制候选词条批准时的自动生成；页面中的手动生成功能始终可用。
        enabled: false
        provider: ark-search
        prompt: classpath:prompts/variant-generation.md
        temperature: 0.2
        web-search-max-keyword: 2
        web-search-enabled: true
      regengbaike-extraction:
        enabled: true
        provider: general-openai
        prompt: classpath:prompts/regengbaike-extraction.md
        temperature: 0.1
        maximum-source-characters: 12000
        minimum-confidence: 0.6
      popcidian-enrichment:
        enabled: true
        provider: ark-search
        prompt: classpath:prompts/popcidian-enrichment.md
        temperature: 0.1
        web-search-max-keyword: 2
        web-search-enabled: true
        maximum-source-characters: 12000
        minimum-confidence: 0.6
      buzzword-enrichment:
        enabled: true
        provider: ark-search
        prompt: classpath:prompts/buzzword-enrichment.md
        temperature: 0.1
        web-search-max-keyword: 2
        web-search-enabled: true
        maximum-source-characters: 12000
        minimum-confidence: 0.6
      chime-enrichment:
        enabled: true
        provider: ark-search
        prompt: classpath:prompts/chime-enrichment.md
        temperature: 0.1
        web-search-max-keyword: 2
        web-search-enabled: true
        maximum-source-characters: 12000
        minimum-confidence: 0.6
  recognition:
    v2:
      enabled: true
      semantic-recall-enabled: true
      min-confidence: 0.6
      max-results: 20
      sentence-max-characters: 480
      fallback-to-v1-on-search-failure: true
      fallback-to-v1-on-embedding-failure: true
      lexical-top-k: 20
      semantic-top-k: 20
      minimum-semantic-score: 0.65
  search:
    elasticsearch:
      enabled: ${VIBELEX_ES_ENABLED:true}
      uris: ${VIBELEX_ES_URIS}
      index-name: ${VIBELEX_ES_INDEX_NAME:vibelex_sense}
      index-alias: ${VIBELEX_ES_INDEX_ALIAS:vibelex_sense_current}
      connect-timeout-millis: 1000
      request-timeout-millis: 3000
    embedding:
      enabled: ${VIBELEX_EMBEDDING_ENABLED:true}
      endpoint: ${VIBELEX_EMBEDDING_ENDPOINT}
      model-name: ${VIBELEX_EMBEDDING_MODEL_NAME:bge-large-zh}
      vector-dimension: 1024
      similarity: cosine
      connect-timeout-millis: 3000
      request-timeout-millis: 30000
    index-worker:
      fixed-delay-millis: 5000
    rebuild-worker:
      fixed-delay-millis: ${VIBELEX_SEARCH_REBUILD_WORKER_FIXED_DELAY_MILLIS:5000}
  recommendation:
    v3:
      enabled: ${VIBELEX_RECOMMENDATION_V3_ENABLED:true}
      max-context-characters: 480
      default-max-results: 10
      max-results-limit: 20
      semantic-top-k: 50
      lexical-top-k: 50
      minimum-semantic-score: 0.65
      rrf-rank-constant: 60
      semantic-weight: 0.7
      lexical-weight: 0.3
      origin:
        enabled: ${VIBELEX_RECOMMENDATION_V3_ORIGIN_ENABLED:true}
        max-evidence-per-item: ${VIBELEX_RECOMMENDATION_V3_ORIGIN_MAX_EVIDENCE_PER_ITEM:10}
      reranker:
        enabled: ${VIBELEX_RERANKER_ENABLED:true}
        endpoint: ${VIBELEX_RERANKER_ENDPOINT:http://10.145.12.11:8082}
        connect-timeout-millis: ${VIBELEX_RERANKER_CONNECT_TIMEOUT_MILLIS:1000}
        request-timeout-millis: ${VIBELEX_RERANKER_REQUEST_TIMEOUT_MILLIS:10000}
